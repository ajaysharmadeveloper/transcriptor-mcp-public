name: Feature request
description: Suggest something Transcriptor should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are deliberately not built, with reasons written down —
        speaker diarization, multi-user, real-time streaming, running in a
        container. See "What is deliberately not built" in the README before
        opening one of those; if you disagree with the reasoning, say so
        directly, that is a more useful issue than the request itself.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you currently cannot?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: >-
        Rough is fine. If it touches the pipeline, the schema or a tool
        signature, say so — those are the expensive parts to change.

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it hold to the project's constraints?
      options:
        - label: It needs no API key and no network at transcription time
        - label: It stores nothing durable outside Postgres
        - label: It does not require a service beyond Postgres
